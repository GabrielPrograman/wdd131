<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Loading Demonstration</title>
    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>
<body>
    
    <main>
        <h1>Responsive Lazy Loading Gallery</h1>
        <img src="https://picsum.photos/400/600?random=1" alt="Beautiful landscape 1" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/400/600?random=2" alt="Beautiful landscape 2" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/400/600?random=3" alt="Beautiful landscape 3" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/400/600?random=4" alt="Beautiful landscape 4" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/400/600?random=5" alt="Beautiful landscape 5" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/400/600?random=6" alt="Beautiful landscape 6" width="400" height="600" loading="lazy">
    </main>

    <footer>
        <p>&copy; 2026 | Web Frontend Development Club</p>
        <p id="last-modified"></p>
    </footer>
</body>
</html>
